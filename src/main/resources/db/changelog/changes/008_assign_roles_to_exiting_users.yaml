databaseChangeLog:
  - changeSet:
      id: 8
      author: Oleg
      changes:
        - sql:
            sql: |
                INSERT INTO users_roles (user_id, role_id)
                SELECT u.id, 1
                FROM users u
                WHERE NOT EXISTS (
                  SELECT *
                  FROM users_roles ur
                  WHERE ur.user_id = u.id
                )
